server:
  port: 8080

spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # The ONLY security setting the gateway needs. From this URL it finds the discovery
          # document, then /oauth2/jwks, then the public key. It also rejects tokens whose
          # "iss" claim isn't exactly this value.
          issuer-uri: http://localhost:9000

ledgerflow:
  services:
    identity: http://localhost:9000

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway   # /actuator/gateway/routes lists the routes (needs a token)
